plugins {
    id 'java'
    id("org.springframework.boot") version "4.0.0-M2"
    id("io.spring.dependency-management") version "1.1.7"
}

version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation group: 'org.seleniumhq.selenium', name: 'selenium-java', version: '4.35.0'
    implementation group: 'io.github.bonigarcia', name: 'webdrivermanager', version: '6.2.0'
    implementation group: 'org.springframework', name: 'spring-core', version: '7.0.0-M8'
    implementation("org.xerial:sqlite-jdbc:3.50.3.0")
    implementation("org.hibernate.orm:hibernate-community-dialects:7.1.0.Final")
    testImplementation("org.springframework.boot:spring-boot-starter-test:4.0.0-M2")
    implementation("org.springframework.boot:spring-boot-starter-data-jpa:4.0.0-M2")
    implementation("org.springframework.boot:spring-boot-starter-validation:4.0.0-M2")
}

test {
    useJUnitPlatform()
}
